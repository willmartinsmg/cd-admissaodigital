services:
  api:
    container_name: admissaoapi
    build:
      context: .
      dockerfile: Dockerfile.api
      target: production
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    restart: unless-stopped

  web:
    container_name: admissaoweb
    build:
      context: .
      dockerfile: Dockerfile.web
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL}
    env_file:
      - .env.production
    depends_on:
      - api
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api
      - web
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 172.23.0.0/16
